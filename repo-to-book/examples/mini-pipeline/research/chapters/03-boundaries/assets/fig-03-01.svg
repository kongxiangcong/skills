04" rx="6" fill="#f3f6f8" stroke="#d6e0e6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="840" y="344" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" font-weight="600" fill="#526472" text-anchor="middle">结果</text><text x="840" y="382" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#526472" text-anchor="middle">未产生</text><path d="M 32 244 H 928" stroke="#d6e0e6" stroke-width="1"/><text x="32" y="456" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#526472" text-anchor="start">虚线框 = 本次调用未到达；异常之后没有继续执行的箭头。</text>
