<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" role="img" aria-labelledby="fig-03-02-title fig-03-02-desc">
<title id="fig-03-02-title">对象存在，不等于执行器支持它</title><desc id="fig-03-02-desc">直接构造非法操作的 Plan 可以成功，但 execute 会拒绝不支持的操作。</desc>
<defs><marker id="fig-03-02-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#526472" stroke-width="1.5"/></marker></defs>
<rect width="960" height="384" fill="white"/>
<text x="32" y="44" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="25" font-weight="600" fill="#182b3a" text-anchor="start">对象存在，不等于执行器支持它</text>
<path d="M 304 188 H 352" fill="none" stroke="#526472" stroke-width="2" marker-end="url(#fig-03-02-arrow)"/><path d="M 632 188 H 680" fill="none" stroke="#526472" stroke-width="2" marker-end="url(#fig-03-02-arrow)"/><rect x="32" y="108" width="272" height="168" rx="6" fill="#ffffff" stroke="#d6e0e6" stroke-width="1.5"/><rect x="360" y="108" width="272" height="168" rx="6" fill="#e8f3f6" stroke="#176a83" stroke-width="1.5"/><rect x="688" y="108" width="240" height="168" rx="6" fill="#ffffff" stroke="#d6e0e6" stroke-width="1.5"/><text x="52" y="148" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="600" fill="#182b3a" text-anchor="start">直接构造对象</text><text x="168" y="204" font-family="DejaVu Sans Mono,Consolas,Noto Sans CJK SC,monospace" font-size="20" font-weight="400" fill="#182b3a" text-anchor="middle">Plan(&#x27;DIV&#x27;, 2, 3)</text><text x="52" y="248" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#526472" text-anchor="start">对象创建成功</text><text x="380" y="148" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="600" fill="#182b3a" text-anchor="start">调用 execute(plan)</text><text x="496" y="204" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="500" fill="#182b3a" text-anchor="middle">ADD / MUL 均不匹配</text><text x="380" y="248" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#526472" text-anchor="start">到达最后一个拒绝分支</text><text x="708" y="148" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="600" fill="#182b3a" text-anchor="start">执行结果</text><text x="808" y="204" font-family="DejaVu Sans Mono,Consolas,Noto Sans CJK SC,monospace" font-size="24" font-weight="600" fill="#176a83" text-anchor="middle">ValueError</text><text x="708" y="248" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#526472" text-anchor="start">没有整数结果</text><text x="32" y="336" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#526472" text-anchor="start">这条路径绕过 compile_expression()，不属于 run() 的正常路径。</text>
</svg>