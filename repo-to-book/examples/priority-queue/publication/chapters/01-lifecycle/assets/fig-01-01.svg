<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="fig-01-01-title fig-01-01-desc" id="fig-01-01-root"><title id="fig-01-01-title">从输入到队首访问</title><desc id="fig-01-01-desc">add构造条目并登记至映射和排序后端；后续peek或pop先清理已移除队首。</desc><defs>
      <style>#fig-01-01-root { color: #182b3a; font-family: "Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
      #fig-01-01-root .diagram-container { overflow-x:auto;width:100% }
      #fig-01-01-root .node { fill:#f3f6f8;stroke:#526472;stroke-width:1.5 }
      #fig-01-01-root .focus { fill:#e8f3f6;stroke:#176a83;stroke-width:2 }
      #fig-01-01-root .name { font-size:22px;font-weight:600;fill:#182b3a }
      #fig-01-01-root .sub { font-size:18px;fill:#526472 }
      #fig-01-01-root .edge { fill:none;stroke:#526472;stroke-width:2;marker-end:url(#fig-01-01-arrow) }
      #fig-01-01-root .label { font-size:18px;fill:#526472 }
      #fig-01-01-root .heading { font-size:28px;fill:#182b3a }
      #fig-01-01-root .mask { fill:white }
      #fig-01-01-root .legend { font-size:18px;fill:#526472 }
      @media print {
#fig-01-01-root .diagram-container { overflow-x:visible }
}</style><marker id="fig-01-01-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526472"/></marker></defs><rect width="960" height="600" fill="#fff"/><text x="40" y="56" class="heading">从输入到队首访问</text><path d="M480 176 V224" class="edge"/><path d="M480 320 V368" class="edge"/><path d="M340 416 H224 Q216 416 216 424 V464" class="edge"/><path d="M620 416 H736 Q744 416 744 424 V464" class="edge"/><rect x="280" y="88" width="400" height="88" rx="8" class="node"/><text x="480.0" y="120" text-anchor="middle" class="name">add(task, priority)</text><text x="480.0" y="150" text-anchor="middle" class="sub">转换优先级；同任务先 remove</text><rect x="280" y="228" width="400" height="92" rx="8" class="focus"/><text x="480.0" y="260" text-anchor="middle" class="name">创建新 entry</text><text x="480.0" y="290" text-anchor="middle" class="sub">[有效优先级, 新序号, task]</text><rect x="280" y="372" width="400" height="88" rx="8" class="node"/><text x="480.0" y="404" text-anchor="middle" class="name">登记并插入后端</text><text x="480.0" y="434" text-anchor="middle" class="sub">先字典映射，再 _push_entry</text><rect x="72" y="468" width="288" height="52" rx="6" class="node"/><text x="216" y="500" text-anchor="middle" class="name">peek：清理后读队首</text><rect x="600" y="468" width="288" height="52" rx="6" class="node"/><text x="744" y="500" text-anchor="middle" class="name">pop：清理后弹出并删映射</text><text x="40" y="568" class="legend">实线：成功路径。peek / pop 是后续二选一调用，不是 add 内部调用。</text><line x1="40" y1="536" x2="920" y2="536" stroke="#d6e0e6"/></svg>
