interface:
  display_name: "Repo to Write"
  short_description: "按已确认 outline.md 与章内素材，在同目录逐章撰写 manuscript.md 并构建 HTML/PDF"
  default_prompt: "使用 $repo-to-write，读取专题目录下的 outline.md 与各章 materials.md，按已确认大纲在各章写入 manuscript.md 并构建离线 HTML。不拆章合章，不用引导式问句标题，保留必要英文术语。"
policy:
  allow_implicit_invocation: false
